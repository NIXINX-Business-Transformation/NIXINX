name: Corporate PWA — Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/organization-acronym.test.mjs tests/commercial-profile-validation.test.mjs tests/commercial-fiscal-endpoint.test.mjs tests/commercial-support-endpoint.test.mjs tests/marketing-lead-notification.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/assessment-event-notification.test.mjs
