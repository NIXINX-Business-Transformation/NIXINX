name: Public homepage motion QA
on:
  pull_request:
    paths:
      - 'components/site.tsx'
      - 'components/use-public-story.ts'
      - 'components/use-cursor-mist.ts'
      - 'components/public-story.css'
      - 'app/style.css'
      - 'tests/public-story-browser.mjs'
      - '.github/workflows/public-story-qa.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      NX_QA_ENGINE: ${{ matrix.engine }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Public homepage local browser QA (no external API)
        run: |
          npm run start -- -p 3100 > /tmp/nixinx-public-qa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/en >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/en >/dev/null
          node tests/public-story-browser.mjs
